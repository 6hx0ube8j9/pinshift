name: Build PinShift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686

      - name: Build x64 Binary
        run: |
          x86_64-w64-mingw32-windres -i res.rc -o res_x64.o
          x86_64-w64-mingw32-gcc -O3 -s -mwindows -Wall -DUNICODE -D_UNICODE \
            core.c res_x64.o -o PinShift-x64.exe \
            -lkernel32 -luser32 -lshell32 -ladvapi32 -lgdi32 -lcomctl32

      - name: Build x86 Binary
        run: |
          i686-w64-mingw32-windres -i res.rc -o res_x86.o
          i686-w64-mingw32-gcc -O3 -s -mwindows -Wall -DUNICODE -D_UNICODE \
            core.c res_x86.o -o PinShift-x86.exe \
            -lkernel32 -luser32 -lshell32 -ladvapi32 -lgdi32 -lcomctl32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinShift-Windows
          path: |
            PinShift-x64.exe
            PinShift-x86.exe
