name: Build PinShift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-w64-mingw32
            artifact: PinShift-x64.exe
          - arch: x86
            target: i686-w64-mingw32
            artifact: PinShift-x86.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 binutils-mingw-w64

      - name: Compile Resource & Binary
        run: |
          ${{ matrix.target }}-windres -i res.rc -o res.o
          ${{ matrix.target }}-gcc -O3 -s -mwindows -DUNICODE -D_UNICODE \
            core.c res.o -o ${{ matrix.artifact }} \
            -lkernel32 -luser32 -lshell32 -ladvapi32 -lgdi32

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  package:
    name: Package Release Archive
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 Binary
        uses: actions/download-artifact@v4
        with:
          name: PinShift-x64.exe

      - name: Download x86 Binary
        uses: actions/download-artifact@v4
        with:
          name: PinShift-x86.exe

      - name: Create Zip Archive
        run: |
          zip -9 PinShift-Windows.zip PinShift-x64.exe PinShift-x86.exe

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinShift-Windows.zip
          path: PinShift-Windows.zip
